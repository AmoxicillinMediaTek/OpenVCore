<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" width="1254" height="1254" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <!-- Soft-edged patches: light and dark orange fading to transparent -->
    <radialGradient id="light">
      <stop offset="0" stop-color="#FF8C0A" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#FF8C0A" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FF8C0A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dark">
      <stop offset="0" stop-color="#E55804" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#E55804" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#E55804" stop-opacity="0"/>
    </radialGradient>
    <!-- Slight softness on the letter edges (ignored harmlessly by renderers without filter support) -->
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="frame"><rect width="1254" height="1254"/></clipPath>
  </defs>

  <!-- Base orange -->
  <rect width="1254" height="1254" fill="#FB6C02"/>

  <g clip-path="url(#frame)">
    <!-- Lighter patches -->
    <g fill="url(#light)">
      <ellipse cx="900" cy="110" rx="330" ry="150"/>
      <ellipse cx="620" cy="190" rx="240" ry="120"/>
      <ellipse cx="40" cy="250" rx="160" ry="250"/>
      <ellipse cx="100" cy="1100" rx="230" ry="200"/>
      <ellipse cx="420" cy="1190" rx="320" ry="120"/>
      <ellipse cx="880" cy="650" rx="190" ry="140"/>
      <ellipse cx="1000" cy="1130" rx="240" ry="130"/>
      <ellipse cx="380" cy="330" rx="220" ry="120"/>
    </g>
    <!-- Darker patches -->
    <g fill="url(#dark)">
      <ellipse cx="1150" cy="330" rx="240" ry="210"/>
      <ellipse cx="1090" cy="760" rx="190" ry="210"/>
      <ellipse cx="320" cy="830" rx="320" ry="220"/>
      <ellipse cx="1090" cy="220" rx="200" ry="120"/>
      <ellipse cx="120" cy="560" rx="200" ry="140"/>
      <ellipse cx="650" cy="80" rx="170" ry="90"/>
      <ellipse cx="620" cy="1000" rx="280" ry="150"/>
      <ellipse cx="850" cy="320" rx="190" ry="110"/>
    </g>
  </g>

  <!-- White script "S" -->
  <path d="M 770 452
           C 782 412, 748 398, 705 400
           C 640 403, 535 450, 530 520
           C 527 580, 612 602, 682 632
           C 750 662, 770 695, 742 738
           C 712 782, 622 822, 556 826
           C 492 829, 452 790, 463 738"
        fill="none" stroke="#FFFFFF" stroke-width="72"
        stroke-linecap="round" stroke-linejoin="round"
        filter="url(#soft)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
